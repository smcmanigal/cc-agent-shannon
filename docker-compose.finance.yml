# Finance agent (owner-specific; tracked in the private overlay repo).
# Loaded via COMPOSE_FILE in .env.
services:
  finance-agent:
    build: .
    container_name: ${PREFIX:?}-finance-agent
    volumes:
      - ${OWNER_HOME:?set in .env}/.claude-agent-finance:/home/agent/.claude
      - ./agents/finance:/workspace   # private FinanceAgent clone; no SSH key, so it can't push
      - ${OWNER_HOME:?set in .env}/.finance-agent-secrets/zerolib:/home/agent/.config/zerolib   # its own EFX Work login
      # Its rules and the email-send block live in this repo, read-only so the agent can't edit them.
      - ./ops/finance/CLAUDE.local.md:/workspace/CLAUDE.local.md:ro
      - ./ops/finance/block-email-send.sh:/home/agent/.claude/hooks/block-email-send.sh:ro
      - ./ops/finance/managed-settings.json:/etc/claude-code/managed-settings.json:ro   # the hook, where the agent can't remove it
      - ./shared/finance:/shared/finance:rw
      - ./shared/common:/shared/common:ro
    environment:
      - TERM=xterm-256color
      - BROWSER=echo
      - TZ=${TZ:?}
      - CLAUDE_AUTOCOMPACT_PCT_OVERRIDE=14
      - AGENT_MODEL=${AGENT_MODEL:?}
      - CLAUDE_CONFIG_DIR=/home/agent/.claude   # .claude.json lives in the mounted folder
      - PATH=/workspace/.venv/bin:/home/agent/.bun/bin:/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - GIT_AUTHOR_NAME=${GIT_NAME:?}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL:?}
      - GIT_COMMITTER_NAME=${GIT_NAME:?}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL:?}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tmux", "has-session", "-t", "main"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s   # entrypoint downloads the Claude binary before tmux starts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
